{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account</title>

<link rel="stylesheet" href="{% static 'css/style.css' %}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #fff;

    background:
        radial-gradient(circle at 20% 30%, rgba(255, 85, 0, 0.18), transparent 35%),
        radial-gradient(circle at 80% 20%, rgba(255, 120, 0, 0.15), transparent 30%),
        radial-gradient(circle at 60% 80%, rgba(255, 80, 0, 0.12), transparent 40%),
        linear-gradient(135deg, #050505 0%, #0b0b0f 45%, #111827 100%);

    background-attachment: fixed;
}
</style>

</head>

<body class="bg-light">

<div class="container py-5">
<div class="row shadow-lg rounded overflow-hidden">

<!-- Left Side Image -->
<div class="col-md-6 p-0">
<img src="https://images.unsplash.com/photo-1521791136064-7986c2920216?w=1000"
class="img-fluid w-100 h-100"
style="object-fit:cover; min-height:600px;"
alt="Create Account">
</div>

<!-- Right Side Signup Form -->
<div class="col-md-6 bg-white p-5">

<h2 class="text-center text-primary mb-4">
Create Account
</h2>

<form method="POST">
    {% csrf_token %}

<div class="mb-3">
<label class="form-label">Full Name</label>
<input type="text" id="name" name="username" class="form-control" placeholder="Enter Name" required>
</div>

<div class="mb-3">
<label class="form-label">Email Address</label>
<input type="email" id="email" name="email" class="form-control" placeholder="Enter Email" required>
</div>

<div class="mb-3">
<label class="form-label">Password</label>
<input type="password" id="password" name="password" class="form-control" placeholder="Create Password" required>
</div>

<div class="mb-3">
<label class="form-label">Confirm Password</label>
<input type="password" id="confirmPassword" class="form-control" placeholder="Confirm Password" required>
</div>

<button type="submit"
        class="btn btn-primary btn-lg">
    Create Account
</button>

</form>

<p class="text-center mt-3">
Already have an account?
<a href="{% url 'login' %}">Login</a>
</p>

</div>

</div>
</div>

</body>
</html>
