{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - SportFit Store</title>

<link rel="stylesheet" href="{% static 'css/style.css' %}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #fff;

    background:
        radial-gradient(circle at 20% 30%, rgba(255, 85, 0, 0.18), transparent 35%),
        radial-gradient(circle at 80% 20%, rgba(255, 120, 0, 0.15), transparent 30%),
        radial-gradient(circle at 60% 80%, rgba(255, 80, 0, 0.12), transparent 40%),
        linear-gradient(135deg, #050505 0%, #0b0b0f 45%, #111827 100%);

    background-attachment: fixed;
}
</style>

</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
<div class="container">
<a class="navbar-brand fw-bold" href="{% url 'index' %}">
    SportFit
</a>
</div>
</nav>

<!-- Login Section -->
<div class="container py-5">
<div class="row shadow-lg rounded overflow-hidden">

<!-- Left Image -->
<div class="col-md-6 p-0">
<img src="https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=1000"
class="img-fluid w-100 h-100"
style="object-fit:cover; min-height:500px;"
alt="Sports">
</div>

<!-- Right Login Form -->
<div class="col-md-6 bg-white p-5">

<h2 class="text-center text-primary mb-4">
Login Account
</h2>

<form method="POST">
    {% csrf_token %}

<div class="mb-3">
<label class="form-label">UserName</label>
<input type="text" name="username" class="form-control" placeholder="Enter Username" required>
</div>

<div class="mb-3">
<label class="form-label">Password</label>
<input type="password" name="password" class="form-control" placeholder="Enter Password" required>
</div>

<div class="d-grid">
<button class="btn btn-primary btn-lg">
Login
</button>
</div>

</form>

<hr>

<p class="text-center">
Don't have an account?
<a href="{% url 'signup' %}">Create Account</a>
</p>

</div>

</div>
</div>

...

<script>
    
function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const savedEmail = localStorage.getItem("email");
    const savedPassword = localStorage.getItem("password");

    if (email === savedEmail && password === savedPassword) {
        alert("Login Successful");
        window.location.href = "{% url 'index' %}";
    } else {
        alert("Invalid Email or Password");
    }
}
</script>

<!-- Footer -->
<footer class="bg-primary text-white text-center py-3">
<p class="mb-0">© 2026 SportFit Store</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/script.js' %}"></script>
</body>
</html>
