{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coupon - SportFit</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#111;
    color:white;
}

.coupon-box{
    max-width:700px;
    margin:80px auto;
    background:#222;
    border-radius:15px;
    padding:40px;
    text-align:center;
    box-shadow:0 0 20px rgba(4, 3, 3, 0.2);
}

h1{
    color:#ffc107;
    font-weight:bold;
}

.coupon-code{
    font-size:40px;
    font-weight:bold;
    background:#ffc107;
    color:#000;
    display:inline-block;
    padding:15px 40px;
    border-radius:10px;
    margin:20px 0;
}

.btn-copy{
    margin-top:20px;
}

img{
    width:250px;
    border-radius:15px;
}
</style>

</head>
<body>

<div class="container">

<div class="coupon-box">

<img src="{% static 'image/images11.jpg'%}">


<h1 class="mt-4">🎉 Special Coupon</h1>

<p>Use the coupon below and get</p>

<h2 class="text-danger">20% OFF</h2>

<div class="coupon-code" id="code">
SPORT20
</div>

<p>Minimum Purchase ₹2999</p>

<button class="btn btn-warning btn-copy" onclick="copyCoupon()">
Copy Coupon
</button>

<br><br>

<a href="{% url 'products' %}" class="btn btn-primary">
    Shop Now
</a>

</div>

</div>

<script>
function copyCoupon(){

navigator.clipboard.writeText("SPORT20");

alert("Coupon Code Copied!");

}
</script>

</body>
</html>
