{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Accessories - SportFit Store</title>

<link rel="stylesheet" href="{% static 'css/style.css' %}">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: #fff;

    background:
        radial-gradient(circle at 20% 30%, rgba(255, 85, 0, 0.18), transparent 35%),
        radial-gradient(circle at 80% 20%, rgba(255, 120, 0, 0.15), transparent 30%),
        radial-gradient(circle at 60% 80%, rgba(255, 80, 0, 0.12), transparent 40%),
        linear-gradient(135deg, #050505 0%, #0b0b0f 45%, #111827 100%);

    background-attachment: fixed;
}
</style>

</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
<div class="container">
<a class="navbar-brand fw-bold" href="{% url 'index' %}">
    SportFit
</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="navbarNav">
<ul class="navbar-nav ms-auto">
    <li class="nav-item">
        <a class="nav-link" href="{% url 'index' %}">Home</a>
    </li>

    <li class="nav-item">
        <a class="nav-link" href="{% url 'products' %}">Products</a>
    </li>

    <li class="nav-item">
        <a class="nav-link active" href="{% url 'sports-accessories' %}">
            Accessories
        </a>
    </li>

    <li class="nav-item">
        <a class="nav-link" href="{% url 'cart' %}">Cart</a>
    </li>
</ul>
</div>
</div>
</nav>

<!-- Header -->
<section class="bg-dark text-white text-center py-5">
<div class="container">
<h1 class="display-4 fw-bold">Sports Accessories</h1>
<p class="lead">Complete Your Fitness Journey</p>
</div>
</section>

<!-- Accessories -->
<div class="container my-5">
<div class="row g-4">

<div class="col-md-3">
<div class="card shadow">
<img src="https://images.unsplash.com/photo-1518611012118-696072aa579a?w=500"
class="card-img-top" style="height:250px;object-fit:cover;">
<div class="card-body text-center">
<h5>Smart Watch</h5>
<p class="text-primary fw-bold">₹1,999</p>
<button class="btn btn-primary"
        onclick="addToCart('Smart Watch',1999)">
    Add to Cart
</button>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card shadow">
<img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
class="card-img-top" style="height:250px;object-fit:cover;">
<div class="card-body text-center">
<h5>Headphones</h5>
<p class="text-primary fw-bold">₹1,499</p>
<button class="btn btn-primary"
        onclick="addToCart('Headphones',1499)">
    Add to Cart
</button>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card shadow">

<img src="{% static 'image/images7.jpg'%}"
class="card-img-top" style="height:250px;object-fit:cover;">

<div class="card-body text-center">
<h5>Gym Bag</h5>
<p class="text-primary fw-bold">₹899</p>
<button class="btn btn-primary"
        onclick="addToCart('Gym Bag',899)">
    Add to Cart
</button>
</div>
</div>
</div>

<div class="col-md-3">
<div class="card shadow">
<img src="https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=500"
class="card-img-top" style="height:250px;object-fit:cover;">
<div class="card-body text-center">
<h5>Water Bottle</h5>
<p class="text-primary fw-bold">₹299</p>
<button class="btn btn-primary"
        onclick="addToCart('Water Bottle',299)">
    Add to Cart
</button>
</div>
</div>
</div>

</div>
</div>

<!-- Footer -->
<footer class="bg-primary text-white text-center py-3">
<p class="mb-0">© 2026 SportFit Store | All Rights Reserved</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'js/script.js' %}"></script>
</body>
</html>
